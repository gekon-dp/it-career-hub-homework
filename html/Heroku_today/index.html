<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Heroku</title>
</head>

<body>
    <form class="container">
        <h2>Get started on Heroku today</h2>
        <input type="text" name="userFirstName" placeholder="First name" />
        <input type="text" name="userLastName" placeholder="Last name" />
        <input type="email" name="email" placeholder="Email address" />
        <input type="text" id="company-name" name="companyName" placeholder="Company name" />
        <label for="company-name">No company? Enter your email, again.</label>
        <select name="country" id="country">
            <option value="countrySelect">Country/Region</option>
            <option value="germany">Germany</option>
            <option value="spain">Spain</option>
            <option value="france">France</option>
        </select>
        <button class="submit">Get Started</button>
        <p>
            This site is protected by reCAPTCHA and the Google
            <a href="#">Privacy Policy</a> and
            <a href="#">Terms of Service</a> apply
        </p>
    </form>
</body>

</html>
