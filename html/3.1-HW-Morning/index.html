<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" type="text/css" />
    <title>Login Form</title>
</head>

<body>
    <div class="section">
        <div class="container">
            <form class="unknown">
                <fieldset class="form-head">
                    <legend>Name</legend>
                    <input type="text" name="name" placeholder="First name" required />
                    <input type="text" name="second name" placeholder="Second name" required />
                </fieldset>
                <div class="form-middle">
                    <fieldset class="gender">
                        <legend>Gender</legend>
                        <div>
                            <input type="radio" id="male" name="gender" role="gender" required />
                            <label for="male">Male</label>
                        </div>
                        <div>
                            <input type="radio" id="female" name="gender" role="gender" required />
                            <label for="female">Female</label>
                        </div>
                        <div>
                            <input type="radio" id="other" name="gender" role="gender" required />
                            <label for="other">Other</label>
                        </div>
                    </fieldset>
                    <fieldset class="notification">
                        <legend>Notification</legend>
                        <div>
                            <input type="checkbox" id="email" name="email" role="notification" required />
                            <label for="email">Email</label>
                        </div>
                        <div>
                            <input type="checkbox" id="sms" name="sms" role="notification" required />
                            <label for="sms">SMS</label>
                        </div>
                    </fieldset>
                </div>
                <div class="form-bottom">
                    <button type="submit" name="submitButton">Login</button>
                </div>
            </form> <!-- i dont know what here write -->
        </div>
    </div>
</body>

</html>
